<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>fifteenth — gist() tests</title>
    <script type="importmap">
        {
            "imports": {
                "fifteenth/": "/",
                "assign-gingerly/": "/node_modules/assign-gingerly/"
            }
        }
    </script>
</head>
<body>
    <div id="test-complete"></div>
    <script type="module">
        import { get } from 'fifteenth/get.js';
        import { set } from 'fifteenth/set.js';
        import { configureGist, gistProtocols } from 'fifteenth/gist.js';
        import { resolveValues } from 'assign-gingerly/resolve/resolveValues.js';

        const results = [];
        let passed = 0;
        let failed = 0;

        async function test(name, fn) {
            try {
                await fn();
                passed++;
                results.push(`PASS: ${name}`);
            } catch (e) {
                failed++;
                results.push(`FAIL: ${name} — ${e.message || e}`);
            }
        }
        function assert(actual, expected, msg) {
            if (actual !== expected) throw new Error(`${msg}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
        }
        function assertDeep(actual, expected, msg) {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                throw new Error(`${msg}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
            }
        }

        // ---- in-memory fetch stub emulating api.github.com/gists ----

        const realFetch = window.fetch;
        const stub = { gists: new Map(), seq: 0, posts: 0, lastAuth: undefined, owner: 'octocat' };

        function shape(files) {
            const out = {};
            for (const [name, content] of Object.entries(files)) {
                out[name] = { filename: name, content, truncated: false, raw_url: `https://gist.stub/${name}` };
            }
            return out;
        }
        function json(status, obj, headers = {}) {
            return new Response(JSON.stringify(obj), { status, headers: { 'Content-Type': 'application/json', ...headers } });
        }

        window.fetch = async (url, init = {}) => {
            const u = new URL(url, location.href);

            // Raw CDN — GET only, no auth. Two shapes GitHub serves:
            //   /<owner>/<id>/raw/[<sha>/]<file>   (explicit owner)
            //   /raw/<id>/[<sha>/]<file>           (owner-less, used by readVia:'raw')
            if (u.hostname === 'gist.githubusercontent.com') {
                stub.rawGets = (stub.rawGets || 0) + 1;
                stub.lastRawUrl = u.href;
                let m = u.pathname.match(/^\/raw\/([^/]+)\/(?:[0-9a-f]{7,40}\/)?(.+)$/);
                if (!m) m = u.pathname.match(/^\/[^/]+\/([^/]+)\/raw\/(?:[0-9a-f]{7,40}\/)?(.+)$/);
                if (!m) return new Response('bad raw path', { status: 400 });
                const [, id, file] = m;
                const g = stub.gists.get(id);
                if (!g || !(file in g)) return new Response('Not Found', { status: 404 });
                return new Response(g[file], { status: 200, headers: { 'Content-Type': 'text/plain' } });
            }

            if (u.hostname !== 'api.github.com') return realFetch(url, init);

            const method = (init.method || 'GET').toUpperCase();
            const hdrs = init.headers || {};
            stub.lastAuth = hdrs.Authorization || hdrs.authorization;

            const item = u.pathname.match(/^\/gists\/([^/?#]+)$/);

            if (u.pathname === '/gists' && method === 'POST') {
                stub.posts++;
                const id = `g${++stub.seq}`;
                const body = JSON.parse(init.body);
                const files = {};
                for (const [n, f] of Object.entries(body.files)) files[n] = f.content;
                stub.gists.set(id, files);
                return json(
                    201,
                    { id, files: shape(files), owner: stub.owner ? { login: stub.owner } : null },
                    { Location: `https://api.github.com/gists/${id}` },
                );
            }
            if (item && method === 'GET') {
                const g = stub.gists.get(item[1]);
                if (!g) return json(404, { message: 'Not Found' });
                return json(200, { id: item[1], files: shape(g), owner: stub.owner ? { login: stub.owner } : null });
            }
            if (item && method === 'PATCH') {
                const g = stub.gists.get(item[1]);
                if (!g) return json(404, { message: 'Not Found' });
                const body = JSON.parse(init.body);
                for (const [n, f] of Object.entries(body.files)) {
                    if (f === null) delete g[n]; else g[n] = f.content;
                }
                return json(200, { id: item[1], files: shape(g) });
            }
            if (item && method === 'DELETE') {
                stub.gists.delete(item[1]);
                return new Response('', { status: 204 });
            }
            return json(405, { message: 'not stubbed' });
        };

        function clearHash() {
            history.replaceState(history.state, '', location.pathname + location.search);
        }
        /** The raw stored value for `alias` — "id", or "owner/id" once an owner is known. */
        function rawHashValue(alias) {
            return new URLSearchParams(location.hash.slice(1)).get(`gistID:${alias}`);
        }
        /** The bare gist id for `alias`, whichever stored form it's in. */
        function hashId(alias) {
            const stored = rawHashValue(alias);
            if (stored == null) return null;
            const slash = stored.indexOf('/');
            return slash === -1 ? stored : stored.slice(slash + 1);
        }

        // ---- tests ----

        await test('set (no chain) creates a gist, records its id in the hash; get reads it back', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok' });
            await set('gist://prefs', { a: 1 });
            const id = hashId('prefs');
            assert(typeof id === 'string' && id.length > 0, true, 'id recorded in hash');
            assertDeep(await get('gist://prefs'), { a: 1 }, 'round-trip');
        });

        await test('set with accessor chain merges into the existing file (no clobber)', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok' });
            await set('gist://p2', { a: 1 });
            await set('gist://p2?.b?.c', 9);
            assertDeep(await get('gist://p2'), { a: 1, b: { c: 9 } }, 'merge');
            await set('gist://p2?.b?.c', 10);
            assertDeep(await get('gist://p2'), { a: 1, b: { c: 10 } }, 'overwrite leaf, keep sibling');
        });

        await test('get on an unmapped alias returns null and does not POST', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok' });
            const before = stub.posts;
            assert(await get('gist://never'), null, 'null for unmapped');
            assert(stub.posts, before, 'no POST on read');
        });

        await test('file segment selects a distinct file inside the same gist', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok' });
            await set('gist://multi/one.json', { which: 1 });
            const id = hashId('multi');
            await set('gist://multi/two.json', { which: 2 });
            assert(hashId('multi'), id, 'same gist id reused for the second file');
            assertDeep(await get('gist://multi/one.json'), { which: 1 }, 'file one');
            assertDeep(await get('gist://multi/two.json'), { which: 2 }, 'file two');
            assert(stub.gists.get(id) && Object.keys(stub.gists.get(id)).length, 2, 'gist holds two files');
        });

        await test('direct id form (=<id>/<file>) skips the id-store', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok' });
            const r = await window.fetch('https://api.github.com/gists', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ public: false, files: { 'data.json': { content: '{"seed":true}' } } }),
            });
            const { id } = await r.json();

            assertDeep(await get(`gist://=${id}`), { seed: true }, 'direct get, default file');
            await set(`gist://=${id}?.extra`, 5);
            assertDeep(await get(`gist://=${id}`), { seed: true, extra: 5 }, 'direct set merge');
            assert(hashId(`=${id}`), null, 'no hash entry for a direct id');
        });

        await test('gistProtocols() bag works with resolveValues', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok' });
            await set('gist://bag', { user: { name: 'Ada' } });
            const protocols = gistProtocols({ getToken: () => 'tok' });
            const out = await resolveValues({ name: 'gist://bag?.user?.name' }, {}, { protocols });
            assertDeep(out, { name: 'Ada' }, 'resolveValues via bag');
        });

        await test('concurrent first writes to one alias create exactly one gist', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok' });
            const before = stub.posts;
            await Promise.all([
                set('gist://race?.x', 1),
                set('gist://race?.y', 2),
                set('gist://race?.z', 3),
            ]);
            assert(stub.posts - before, 1, 'one POST for three concurrent sets');
            const v = await get('gist://race');
            assert(v.x === 1 && v.y === 2 && v.z === 3, true, 'all three merged');
        });

        await test('getToken adds an Authorization: Bearer header', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok-123' });
            stub.lastAuth = undefined;
            await set('gist://authcheck', { n: 1 });
            assert(stub.lastAuth, 'Bearer tok-123', 'auth header sent on write');
        });

        await test('idStore:"localStorage" keeps gist ids out of the URL hash', async () => {
            clearHash();
            localStorage.removeItem('gistID:lsalias');
            configureGist({ getToken: () => 'tok', idStore: 'localStorage' });
            await set('gist://lsalias', { n: 1 });
            assert(hashId('lsalias'), null, 'nothing in hash');
            assert(typeof localStorage.getItem('gistID:lsalias'), 'string', 'id in localStorage');
            assertDeep(await get('gist://lsalias'), { n: 1 }, 'round-trip via localStorage store');
            localStorage.removeItem('gistID:lsalias');
        });

        await test('a 404 on read drops the stale alias mapping', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok' });
            history.replaceState(history.state, '', location.pathname + '#gistID:ghost=g-does-not-exist');
            assert(await get('gist://ghost'), null, 'missing gist → null');
            assert(hashId('ghost'), null, 'stale mapping removed');
        });

        await test('custom defaultFile is honored', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok', defaultFile: 'state.json' });
            await set('gist://df', { ok: 1 });
            const id = hashId('df');
            assert(Object.keys(stub.gists.get(id))[0], 'state.json', 'file created under custom default name');
            assertDeep(await get('gist://df'), { ok: 1 }, 'round-trip via custom default file');
        });

        await test('a write whose content would be empty throws and issues no request', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok' });

            const beforePosts = stub.posts;
            let threw = false;
            try { await set('gist://emptycreate', ''); } catch { threw = true; }
            assert(threw, true, 'empty create rejects');
            assert(stub.posts, beforePosts, 'no POST issued for an empty create');
            assert(hashId('emptycreate'), null, 'no alias mapping recorded');

            await set('gist://emptyupdate', { a: 1 });
            let threw2 = false;
            try { await set('gist://emptyupdate', ''); } catch { threw2 = true; }
            assert(threw2, true, 'empty update rejects');
            assertDeep(await get('gist://emptyupdate'), { a: 1 }, 'existing file left intact after a refused empty update');
        });

        await test('raw form: gist://<owner>/<id>/raw/<file> reads via the CDN, no API call', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok' });
            await set('gist://rawsrc', { hi: 'there', n: 7 });
            const id = hashId('rawsrc');

            stub.rawGets = 0;
            const beforePosts = stub.posts;
            assertDeep(await get(`gist://octo/${id}/raw/data.json`), { hi: 'there', n: 7 }, 'raw read parses JSON');
            assert(stub.rawGets, 1, 'went to gist.githubusercontent.com');
            assert(stub.posts, beforePosts, 'no API write');
            assert(/gist\.githubusercontent\.com\/octo\/.*\/raw\/data\.json$/.test(stub.lastRawUrl), true, 'CDN url shape');
        });

        await test('raw form: accessor chain resolves against the CDN read', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok' });
            await set('gist://rawchain', { user: { name: 'Ada' } });
            const id = hashId('rawchain');
            assert(await get(`gist://x/${id}/raw/data.json?.user?.name`), 'Ada', 'chain over raw read');
        });

        await test('raw form: a pinned <sha> is used in the URL and reads latest content from the stub', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok' });
            await set('gist://rawpin', { v: 1 });
            const id = hashId('rawpin');
            const sha = '0c40975a1055e0b0b543b212e73010781577c0b7';
            stub.lastRawUrl = '';
            assertDeep(await get(`gist://me/${id}/raw/${sha}/data.json`), { v: 1 }, 'pinned raw read');
            assert(stub.lastRawUrl.includes(`/raw/${sha}/data.json`), true, 'sha appears in the CDN url');
        });

        await test('raw form: unknown gist → null', async () => {
            configureGist({ getToken: () => 'tok' });
            assert(await get('gist://nobody/deadbeefdeadbeef/raw/data.json'), null, 'missing raw → null');
        });

        await test('raw form: write without a sha PATCHes the gist through the API', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok' });
            await set('gist://rawwrite', { a: 1 });
            const id = hashId('rawwrite');

            const beforePosts = stub.posts;
            await set(`gist://owner/${id}/raw/data.json`, { a: 1, b: 2 });
            assert(stub.posts, beforePosts, 'no new gist created');
            assertDeep(await get(`gist://=${id}/data.json`), { a: 1, b: 2 }, 'API round-trip sees the raw-form write');

            // non-JSON string tolerated on the raw read path too
            await set(`gist://owner/${id}/raw/data.json`, '<b>hi</b>');
            assert(await get(`gist://owner/${id}/raw/data.json`), '<b>hi</b>', 'raw read returns non-JSON text as-is');
        });

        await test('raw form: writing to a pinned <sha> throws', async () => {
            configureGist({ getToken: () => 'tok' });
            let threw = false;
            try {
                await set('gist://o/abcabcabcabc/raw/0c40975a1055e0b0b543b212e73010781577c0b7/data.json', { x: 1 });
            } catch { threw = true; }
            assert(threw, true, 'pinned-revision write rejected');
        });

        await test('readVia:"raw" reads an alias off the owner-qualified CDN url, writes still go to the API', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok', readVia: 'raw' });

            // create still POSTs the API; the response's owner.login is captured
            const beforePosts = stub.posts;
            await set('gist://rv', { a: 1 });
            assert(stub.posts, beforePosts + 1, 'create went to the API');
            assert(rawHashValue('rv').startsWith(stub.owner + '/'), true, 'id-store remembers "owner/id", not a bare id');

            // read goes straight to gist.githubusercontent.com/<owner>/<id>/raw/<file> — no API GET
            stub.rawGets = 0;
            assertDeep(await get('gist://rv'), { a: 1 }, 'alias read via CDN');
            assert(stub.rawGets, 1, 'one CDN GET');
            assert(stub.lastRawUrl.includes(`/${stub.owner}/`), true, 'owner-qualified CDN url, known from the create response');

            // update still PATCHes the API, and the next raw read reflects it
            await set('gist://rv?.b', 2);
            assertDeep(await get('gist://rv'), { a: 1, b: 2 }, 'CDN read after an API merge');
        });

        await test('readVia:"raw" self-heals a legacy owner-less mapping (one API GET, then the pretty url every time after)', async () => {
            clearHash();
            // Simulate an alias→id mapping recorded before owner-tracking existed:
            // create normally, then rewrite the hash entry back down to a bare id.
            configureGist({ getToken: () => 'tok' });
            await set('gist://legacy', { z: 1 });
            const id = hashId('legacy');
            history.replaceState(history.state, '', location.pathname + location.search + '#gistID:legacy=' + id);

            configureGist({ getToken: () => 'tok', readVia: 'raw' });
            stub.rawGets = 0;
            assertDeep(await get('gist://legacy'), { z: 1 }, 'first raw-mode read still returns the value (self-heals)');
            assert(stub.rawGets, 0, 'that first read went through the API, not the CDN, to learn the owner');
            assert(rawHashValue('legacy'), stub.owner + '/' + id, 'stored value upgraded to "owner/id"');

            stub.rawGets = 0;
            assertDeep(await get('gist://legacy'), { z: 1 }, 'second read');
            assert(stub.rawGets, 1, 'this time it uses the CDN');
            assert(stub.lastRawUrl.includes(`/${stub.owner}/`), true, 'owner-qualified url now');
        });

        await test('readVia:"raw" keeps using the API for an alias whose owner is never discoverable', async () => {
            clearHash();
            const savedOwner = stub.owner;
            stub.owner = null; // simulate create/GET responses with no `owner` field at all
            try {
                configureGist({ getToken: () => 'tok', readVia: 'raw' });
                await set('gist://noowner', { q: 1 });
                assert(rawHashValue('noowner').includes('/'), false, 'nothing to remember — stays a bare id');

                stub.rawGets = 0;
                assertDeep(await get('gist://noowner'), { q: 1 }, 'read still works, falling back to the API');
                assert(stub.rawGets, 0, 'never touches the CDN when the owner can\'t be learned');
            } finally {
                stub.owner = savedOwner;
            }
        });

        await test('readVia:"raw" with =<id> (no alias to remember an owner in) always reads the owner-less CDN url', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok', readVia: 'raw' });
            await set('gist://directraw', { w: 1 });
            const id = hashId('directraw');

            stub.rawGets = 0;
            assertDeep(await get(`gist://=${id}`), { w: 1 }, '=<id> read via CDN even though the alias mapping has an owner');
            assert(stub.rawGets, 1, 'CDN GET');
            assert(/\/raw\/[^/]+\/data\.json$/.test(stub.lastRawUrl), true, 'owner-less url — a bare id has nowhere to learn an owner from');
        });

        await test('readVia:"raw" with an =<id> reads the CDN; an unmapped alias is null with no request', async () => {
            clearHash();
            configureGist({ getToken: () => 'tok', readVia: 'raw' });
            await set('gist://direct', { z: 9 });
            const id = hashId('direct');

            stub.rawGets = 0;
            assertDeep(await get(`gist://=${id}`), { z: 9 }, '=<id> read via CDN');
            assert(stub.rawGets, 1, 'CDN GET for =<id>');

            stub.rawGets = 0;
            assert(await get('gist://nevermapped'), null, 'unmapped alias → null');
            assert(stub.rawGets, 0, 'no CDN request when there is no id');
        });

        // ---- restore & report ----
        window.fetch = realFetch;

        const el = document.getElementById('test-complete');
        if (failed === 0) {
            el.textContent = `All ${passed} tests passed`;
        } else {
            el.textContent = `${failed} of ${passed + failed} tests failed:\n${results.filter(r => r.startsWith('FAIL')).join('\n')}`;
        }
        el.setAttribute('data-status', failed === 0 ? 'pass' : 'fail');
        console.log(results.join('\n'));
    </script>
</body>
</html>
